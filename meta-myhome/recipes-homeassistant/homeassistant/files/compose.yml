version: '3'
services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /data/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    network_mode: host
    devices:
       - /dev/ttyACM0:/dev/ttyACM0
#      - /dev/ttyUSB0:/dev/ttyUSB0
#      - /dev/hidraw0:/dev/hidraw0
    environment:
      DISABLE_JEMALLOC: 'true'
##
  nginx:
    container_name: nginx
    image: docker.io/library/nginx:latest
    volumes:
      - /data/homeassistant/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /data/homeassistant/nginx/ssl:/etc/nginx/ssl:ro
    network_mode: host
    restart: unless-stopped
##
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    volumes:
      - /opt/matter-server:/data
      - /run/dbus:/run/dbus
    network_mode: host
##
  mosquitto:
    container_name: mosquitto
    image: docker.io/library/eclipse-mosquitto:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/homeassistant/mosquitto/config:/mosquitto/config
      - /data/homeassistant/mosquitto/data:/mosquitto/data
      - /data/homeassistant/mosquitto/log:/mosquitto/log
##
  whisper:
    container_name: Whisper
    image: docker.io/rhasspy/wyoming-whisper:latest
    network_mode: host

    volumes:
      - ./whisper:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Madrid
      - CUDA_VERSION=10.2
#      - WHYSPER_LANGUAGE=es_ES
#      - WHYSPER_MODEL=small-int8
    command: --model small-int8 --language es
    restart: unless-stopped
##
  piper:
    container_name: Piper
    image: docker.io/rhasspy/wyoming-piper:latest
    network_mode: host
    volumes:
      - /data/homeassistant/piper:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Madrid
      - CUDA_VERSION=10.2
#       -PIPER_VOICE=es_ES-sharvard-medium
    command: --voice es_ES-sharvard-medium
    restart: unless-stopped
##
  openwakeword:
    container_name: openwakeword
    image: docker.io/rhasspy/wyoming-openwakeword:latest
    network_mode: host
    volumes:
      - ./wakeword:/data
      - ./wakeword:/custom
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Madrid
      - CUDA_VERSION=10.2
    command: --preload-model 'ok_nabu' --custom-model-dir /custom
    restart: unless-stopped
  adguardhome:
    image: docker.io/adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      # Expose port 53 on TCP and UDP for DNS queries
      - "192.168.1.35:53:53/tcp"
      - "192.168.1.35:53:53/udp"
      # Expose port 67 on UDP for DHCP server
      #- "67:67/udp"
      # Expose port 68 on UDP for DHCP client
      - "68:68/udp"
      # Expose port 80 on TCP for HTTP web interface
      - "8081:8081/tcp"
      # Expose port 3000 on TCP for AdGuard Home's API
      - "3000:3000/tcp"
      # Expose port 853 on TCP for DNS-over-TLS (DoT)
      - "853:853/tcp"
      # Expose port 784 on UDP for DNS-over-QUIC (DoQ)
      - "784:784/udp"
      # Expose port 853 on UDP for DNS-over-DTLS (DoT)
      - "853:853/udp"
      # Expose port 8853 on UDP for DNS-over-TLS (DoT)
      - "8853:8853/udp"
      # Expose port 5443 on TCP and UDP for DNSCrypt
      - "5443:5443/tcp"
      - "5443:5443/udp"
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
networks:
  default:
    name: homeassistant_default
    driver: bridge

