version: '3'
services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /home/bob/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    network_mode: host
#    devices:
#      - /dev/ttyUSB0:/dev/ttyUSB0
#      - /dev/ttyACM0:/dev/ttyACM0
#      - /dev/hidraw0:/dev/hidraw0
    environment:
      DISABLE_JEMALLOC: 'true'
##
  nginx:
    container_name: nginx
    image: docker.io/rhasspy/wyoming-whisper:latest
    volumes:
      - /home/bob/homeassistant/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/bob/homeassistant/nginx/ssl:/etc/nginx/ssl:ro
    network_mode: host
    restart: unless-stopped
##
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    volumes:
      - /opt/matter-server:/data
      - /run/dbus:/run/dbus:ro
    network_mode: host
##
  mosquitto:
    container_name: mosquitto
    image: docker.io/library/eclipse-mosquitto:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/bob/homeassistant/mosquitto/config:/mosquitto/config
      - /home/bob/homeassistant/mosquitto/data:/mosquitto/data
      - /home/bob/homeassistant/mosquitto/log:/mosquitto/log
##
  whisper:
    container_name: Whisper
    image: docker.io/rhasspy/wyoming-whisper:latest
    network_mode: host

    volumes:
      - ./whisper:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Madrid
      - CUDA_VERSION=10.2
#      - WHYSPER_LANGUAGE=es_ES
#      - WHYSPER_MODEL=small-int8
    command: --model small-int8 --language es
    restart: unless-stopped
##
  piper:
    container_name: Piper
    image: docker.io/rhasspy/wyoming-piper:latest
    network_mode: host
    volumes:
      - /home/bob/homeassistant/piper:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Madrid
      - CUDA_VERSION=10.2
#       -PIPER_VOICE=es_ES-sharvard-medium
    command: --voice es_ES-sharvard-medium
    restart: unless-stopped
##
  openwakeword:
    container_name: openwakeword
    image: docker.io/rhasspy/wyoming-openwakeword:latest
    network_mode: host
    volumes:
      - ./wakeword:/data
      - ./wakeword:/custom
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Madrid
      - CUDA_VERSION=10.2
    command: --preload-model 'ok_nabu' --custom-model-dir /custom
    restart: unless-stopped
